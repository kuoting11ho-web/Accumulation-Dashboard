<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0C0F13; --surf:#141920; --surf2:#1B222B; --line:#252E39;
    --txt:#E1E7EE; --dim:#76828F; --dim2:#4A5560;
    --amber:#F5D45C; --green:#5BC47A; --red:#E8615A; --onAcc:#0C0F13;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  #nw{background:var(--bg);color:var(--txt);padding:16px;max-width:860px;margin:0 auto;
      min-height:100vh;
      font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
      background-image:linear-gradient(var(--line) 1px,transparent 1px),
                       linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:34px 34px;background-position:-1px -1px;}
  .mlab{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;font-weight:500;
        letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
  .shell{border:1px solid var(--line);background:var(--surf);}

  .mast{border:1px solid var(--line);background:var(--surf2);padding:11px 14px;margin-bottom:14px;
        display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .mast .id{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
            letter-spacing:.2em;color:var(--amber);}
  .mast .sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);
             letter-spacing:.08em;margin-top:3px;}
  .mast .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .mast button{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    border:1px solid var(--line);color:var(--dim);background:transparent;padding:6px 11px;cursor:pointer;}
  .mast button:hover{color:var(--amber);border-color:var(--amber);}
  .mast button[data-on="1"]{background:var(--amber);color:var(--onAcc);
    border-color:var(--amber);font-weight:700;}

  .sechead{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--surf2);
    border-bottom:1px solid var(--line);}
  .sechead:not(:first-child){border-top:1px solid var(--line);}
  .sechead .t{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.16em;}
  .sechead .n{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim);margin-left:auto;}
  .rule{width:20px;height:2px;flex:none;}

  .item{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:baseline;}
  .item:last-child{border-bottom:0;}
  .item .idx{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim2);
    flex:none;width:18px;}
  .item a{font-size:14px;font-weight:600;color:var(--txt);text-decoration:none;flex:1;line-height:1.45;}
  .item a:hover{color:var(--amber);}
  .item .meta{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim2);
    flex:none;white-space:nowrap;text-align:right;}

  .foot{padding:12px 14px;border-top:1px solid var(--line);background:var(--surf2);
    font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim2);
    letter-spacing:.06em;line-height:1.8;}
  .state{padding:40px 16px;text-align:center;}
  .state .m{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;
    color:var(--dim);line-height:1.9;}
  .hide{display:none;}
  @media(max-width:520px){ .item .meta{display:none;} }
</style>

<div id="nw">
  <div class="mast">
    <div>
      <div class="id">DAILY BRIEF</div>
      <div class="sub" id="stamp">載入中⋯</div>
    </div>
    <div class="right" id="filters"></div>
  </div>
  <div class="shell" id="body">
    <div class="state"><div class="m">載入中⋯</div></div>
  </div>
</div>

<script>
(function(){
  var COLORS={world:"var(--red)",ai:"var(--amber)",sport:"var(--green)"};
  var data=null, filter="all";

  // 沿用 dashboard 存下來的配色（同一個網域、同一份設定）
  (function inheritTheme(){
    try{
      var raw=localStorage.getItem("__dash__dashboard-v1");
      if(!raw) return;
      var st=JSON.parse(raw);
      if(!st || !st.theme) return;
      var S=document.getElementById("nw").style;
      Object.keys(st.theme).forEach(function(k){ S.setProperty("--"+k,st.theme[k]); });
      var h=String(st.theme.amber||"#F5D45C").replace("#","");
      if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      var lum=.2126*parseInt(h.slice(0,2),16)/255
             +.7152*parseInt(h.slice(2,4),16)/255
             +.0722*parseInt(h.slice(4,6),16)/255;
      S.setProperty("--onAcc", lum>.5?"#0C0F13":"#FFFFFF");
      document.body.style.background=st.theme.bg||"#0C0F13";
    }catch(e){}
  })();

  function esc(s){ return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function ago(iso){
    if(!iso) return "";
    var h=Math.round((Date.now()-new Date(iso))/3600000);
    if(isNaN(h)) return "";
    return h<1?"剛剛":(h<24?h+"h":Math.round(h/24)+"d");
  }

  function renderFilters(){
    var f=document.getElementById("filters");
    f.innerHTML="";
    var opts=[["all","ALL"]];
    Object.keys(data.streams||{}).forEach(function(k){
      opts.push([k,(data.streams[k].label||k).toUpperCase()]);
    });
    opts.forEach(function(o){
      var b=document.createElement("button");
      b.textContent=o[1];
      b.dataset.on=(filter===o[0])?"1":"0";
      b.onclick=function(){ filter=o[0]; renderFilters(); renderBody(); };
      f.appendChild(b);
    });
    var r=document.createElement("button");
    r.textContent="↻";
    r.title="重新載入";
    r.onclick=function(){ data=null; load(); };
    f.appendChild(r);
  }

  function renderBody(){
    var b=document.getElementById("body"), h="", total=0;
    Object.keys(data.streams||{}).forEach(function(k){
      if(filter!=="all" && filter!==k) return;
      var s=data.streams[k], items=s.items||[];
      h+='<div class="sechead"><span class="rule" style="background:'+(COLORS[k]||"var(--dim)")+'"></span>'+
         '<span class="t" style="color:'+(COLORS[k]||"var(--dim)")+'">'+esc(s.label||k)+'</span>'+
         '<span class="n">'+items.length+'</span></div>';
      if(!items.length){
        h+='<div class="state"><div class="m">這一區今天沒有新項目</div></div>';
      }
      items.forEach(function(it,i){
        total++;
        h+='<div class="item"><span class="idx">'+String(i+1).padStart(2,"0")+'</span>'+
           '<a href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a>'+
           '<span class="meta">'+esc(it.source)+(ago(it.published)?" · "+ago(it.published):"")+'</span></div>';
      });
    });
    var gen=data.generated?new Date(data.generated):null;
    h+='<div class="foot">顯示 '+total+' 則'+
       (data.failures&&data.failures.length
         ? ' · '+data.failures.length+' 個來源抓取失敗' : ' · 所有來源正常')+
       '<br>每天早上自動更新 · 連結在新分頁開啟</div>';
    b.innerHTML=h;
    document.getElementById("stamp").textContent=
      gen? gen.toLocaleString() : "—";
  }

  function load(){
    document.getElementById("body").innerHTML='<div class="state"><div class="m">載入中⋯</div></div>';
    fetch("brief.json?t="+Date.now())
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(j){ data=j; renderFilters(); renderBody(); })
      .catch(function(e){
        document.getElementById("stamp").textContent="—";
        document.getElementById("body").innerHTML=
          '<div class="state"><div class="m">還沒有新聞資料（'+esc(e.message||e)+'）<br>'+
          'GitHub Actions 跑完之後才會產生 brief.json</div></div>';
      });
  }

  load();
})();
</script>
