# 放在 repo 的 .github/workflows/news.yml
name: daily news

on:
  schedule:
    - cron: "23 10 * * *"
    - cron: "23 13 * * *"
    - cron: "23 16 * * *"
  workflow_dispatch:
  
permissions:
  contents: write           # 允許把 brief.json commit 回 repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install feedparser

      - name: Fetch news
        run: python fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brief.json
          if git diff --staged --quiet; then
            echo "沒有變化，略過 commit"
          else
            git commit -m "news: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
